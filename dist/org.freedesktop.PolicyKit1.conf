<!-- System bus policy for nyra-polkitd: /usr/share/dbus-1/system.d/org.freedesktop.PolicyKit1.conf -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the daemon's own user may take the name, and call authentication agents (they are
       ordinary connections of the users, so they cannot be named here). -->
  <policy user="polkitd">
    <allow own="org.freedesktop.PolicyKit1"/>
    <allow send_type="method_call" send_interface="org.freedesktop.PolicyKit1.AuthenticationAgent"/>
  </policy>

  <!-- Anyone may call it: the daemon identifies each caller through the bus and decides who may
       ask what. -->
  <policy context="default">
    <allow send_destination="org.freedesktop.PolicyKit1"
           send_interface="org.freedesktop.PolicyKit1.Authority"/>
    <allow send_destination="org.freedesktop.PolicyKit1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.freedesktop.PolicyKit1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.freedesktop.PolicyKit1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
