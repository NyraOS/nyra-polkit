# SPDX-License-Identifier: MIT
# Releases (CONTRIBUTING.md, "Releases"): a maintainer's signed tag vX.Y.Z on main builds
# nyra-polkitd and pkcheck for x86_64 and aarch64 Linux (glibc), packs one tarball per
# architecture, attests their build provenance and publishes them with SHA256SUMS on GitHub
# Releases.
# Every pull request runs the build and the packing too, without publishing anything, so a change
# that breaks the release (on either architecture) shows up before a tag does.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
permissions: {}
jobs:
  build:
    strategy:
      matrix:
        # Native runners for both architectures: no cross-compiling.
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before anything else on a tag: only a tag signed by a maintainer makes a release. The tag
      # object is fetched again because checkout does not keep it annotated.
      - name: Check the tag's signature
        if: github.ref_type == 'tag'
        run: |
          git fetch -q --no-tags origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          tools/release/verify-tag.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      # And it refuses a tag whose commit is not on main, or whose version is not the version of
      # both crates.
      - name: Check the tag's commit and version
        if: github.ref_type == 'tag'
        run: |
          git fetch -q --no-tags --filter=blob:none origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME is not on main's history"
            exit 1
          fi
          for crate in nyra-polkitd nyra-pkcheck; do
            crate_version=$(cargo pkgid --locked -p "$crate" | sed 's/.*[#@]//')
            if [ "v$crate_version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::$GITHUB_REF_NAME does not match $crate's version $crate_version"
              exit 1
            fi
          done
      # The oldest Rust we support, Debian 13's, as in CI: the same compiler on every release.
      - run: rustup toolchain install 1.85.1 --profile minimal
      - run: cargo +1.85.1 build --release --locked -p nyra-polkitd -p nyra-pkcheck
      - name: Pack
        run: |
          version=dev
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; fi
          tarball=$(tools/release/package.sh "$version" target/package)
          # The packed pkcheck runs and reports the version it was built as.
          tar -xzf "$tarball" -C target/package
          "${tarball%.tar.gz}/bin/pkcheck" --version | grep -Fx "pkcheck version $(cargo pkgid --locked -p nyra-pkcheck | sed 's/.*[#@]//') (nyra-polkit)"
        env:
          RUSTUP_TOOLCHAIN: "1.85.1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.runner }}
          path: target/package/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Its own job: the only one that can get an OIDC token (to sign with Sigstore) and write
  # attestations, and it runs nothing from the repository.
  attest:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarball-*
          merge-multiple: true
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tar.gz

  release:
    if: github.ref_type == 'tag'
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarball-*
          merge-multiple: true
          path: release
      # The notes are the pull requests merged since the previous release, generated by GitHub,
      # after a pointer to the security policy.
      - name: Publish
        working-directory: release
        run: |
          sha256sum -- *.tar.gz >SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "nyra-polkit ${GITHUB_REF_NAME#v}" --generate-notes \
            --notes "To verify a download, see \"Releases\" in the [README](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md#releases). Security issues: please report them privately, as described in [SECURITY.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/SECURITY.md)." \
            -- *.tar.gz SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
