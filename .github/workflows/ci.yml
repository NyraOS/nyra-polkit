# SPDX-License-Identifier: MIT
# Format, lints and unit tests (on stable Rust and on 1.85, the oldest we support: Debian 13's),
# the D-Bus integration tests in Debian 13, licences and advisories of the locked dependencies, and
# a scan for secrets.
# Every push to any branch runs it once; pull_request runs only for pull requests from forks, whose
# pushes do not run here. Weekly as well, so new advisories show up without a code change.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
permissions:
  contents: read
jobs:
  rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustc --version && cargo --version
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: rustup toolchain install 1.85 --profile minimal
      - run: cargo +1.85 test --locked --workspace

  # nyra-polkitd on a private system-like bus, as root in Debian 13: its dbus-daemon gives
  # ProcessFD, its pkcheck and busctl are clients (Debian's pkcheck also runs next to ours, which
  # must answer the same), and its polkitd package creates the polkitd user the daemon runs as and
  # brings pkttyagent and the setuid polkit-agent-helper-1, which one test runs with PAM.
  # Debian's own Rust (1.85) builds it. Privileged, for a writable /sys/fs/cgroup: tests put a
  # process under a user's service manager (user@<uid>.service) or in a session's scope. The job
  # has no secrets and a read-only token.
  integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # debian:trixie, pinned by its multi-arch index digest.
      image: debian:trixie@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apt-get update -q && apt-get install -qy --no-install-recommends ca-certificates cargo rustc dbus-daemon polkitd systemd
      - run: cargo test --locked --test dbus --test compat -- --ignored

  deny:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  # Runs the gitleaks container directly: the gitleaks GitHub Action needs a licence for organizations.
  gitleaks:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks v8.30.1, pinned by its multi-arch index digest, from GitHub's registry (Docker Hub
      # limits unauthenticated pulls per runner IP).
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner -v /repo
