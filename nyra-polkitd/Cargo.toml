# SPDX-License-Identifier: MIT
[package]
name = "nyra-polkitd"
version = "0.1.2"
edition = "2024"
# The Rust in Debian 13 (trixie), so the daemon also builds with the distribution's compiler.
rust-version = "1.85"
license = "MIT"
publish = false
description = "A polkit authority daemon with TOML rules, written from scratch"

# Every dependency is a choice (docs/DESIGN.md, "Dependencies"); prefer none.
[dependencies]
# Reads the action definitions (polkit .policy XML): a small read-only tree, no dependencies of
# its own, never fetches external DTDs or entities.
roxmltree = "0.21"
# Reads the rule files into plain structs (derive), with unknown fields refused.
serde = { version = "1", features = ["derive"] }
# The TOML parser for the rule files; only parsing, no TOML writer.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# The D-Bus service and its calls to the bus and to logind. Pure Rust, no libdbus. Its own small
# async runtime (async-io, the default) is all the daemon needs, so no tokio. 5.13 is the last
# version that builds with Rust 1.85 (deny.toml says why that matters).
zbus = { version = "5.13.2", default-features = false, features = ["async-io"] }
# The rest is already in zbus's dependency tree; used directly, they add no crate:
# - pidfd_open(2) and poll(2) on a pidfd, getrandom(2) for the cookies and CLOCK_BOOTTIME for the
#   temporary authorizations, safely (no unsafe code here);
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "process", "event", "rand", "time"] }
# - SIGHUP (`systemctl reload`) as an async stream, in the same runtime as the bus;
async-signal = "0.2.14"
# - what CancelCheckAuthorization uses to stop a check in flight;
async-channel = "2.5.0"
# - an async mutex, so an agent runs one authentication at a time and the others wait their turn;
async-lock = "3.4.2"
# - block_on for main and racing a check against its cancellation.
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }
# - NSS lookups and /proc reads as blocking tasks, off the bus executor, so a slow user database
#   (LDAP, SSSD) cannot stall every other check;
blocking = "1.7.0"
# A user's name and groups from the user database (NSS: getpwuid_r, getgrouplist), without unsafe
# code here. Only its "user" feature.
nix = { version = "0.31.3", default-features = false, features = ["user"] }

[dev-dependencies]
# Timers for the integration tests' timeouts, so a regression fails instead of hanging the job.
# Already in zbus's dependency tree: no crate added.
async-io = "2.6.0"
# The terminal modes of Debian's pkttyagent, so a password is typed only once it is read. The
# same rustix as above, with its "termios" feature for the tests only.
rustix = { version = "1.1.5", default-features = false, features = ["termios"] }
